# Publishes to npm when a GitHub release is published, through npm trusted publishing:
# no npm token is stored, and npm records a provenance attestation that links the
# package to this workflow run and commit.
# Setup (once): on npmjs.com, package settings → Trusted publisher → GitHub Actions,
# repository fadhlaouir/express-node-starter, workflow npm-publish.yml, environment npm.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node.js 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "${{ github.event.release.tag_name }}"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm publish --provenance --access public
