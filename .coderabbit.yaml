# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every pull request. Its comments are advice for the author
# and the maintainer, not a condition for merging: the maintainer's approval is.
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
